{% extends "base.html" %}
{% block main %}
<div class="form-container">
  <form action="{{ url_for('tasks.delete', task_id=task_id) }}" method="post">
    {{ form.csrf_token }}
    <h3 style="margin-bottom: 1rem; text-align: center; color: #ef4444;">Delete Task</h3>
    <p style="text-align: center; margin-bottom: 2rem; color: #cbd5e1;">Are you sure you want to delete this task?</p>

    <div class="card" style="margin-bottom: 2rem; text-align: center;">
      <h3>{{ task.title }}</h3>
    </div>

    <div class="form-group" style="text-align: center; display: flex; justify-content: center; gap: 1rem;">
      {{ form.submit(class="btn btn-danger", value="Confirm Delete") }}
      <a href="{{ url_for('tasks.index') }}" class="btn btn-primary"
        style="background: transparent; border: 1px solid var(--primary-color);">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
